<figure class="panel reading"><div class="figure-head"><b>LC / SC 看外壳，UPC / APC 看端面</b><span>端面简化侧视图</span></div><div class="endfaces"><div><h3>UPC · 常见蓝色标识</h3><svg viewBox="0 0 330 125" role="img" aria-label="UPC 接触处接近垂直，实际为微球面，并不是完全平面。"><rect x="22" y="32" width="96" height="63" rx="5" fill="#edf3f8" stroke="#88a5bd"/><path d="M118 43H218Q225 64 218 84H118Z" fill="#f7fafb" stroke="#6f8799" stroke-width="2"/><path d="M36 63H221" fill="none" stroke="#315e86" stroke-width="3"/><path d="M244 16L223 45" stroke="#879aaa" fill="none"/><text x="241" y="15" class="svg-small">接近垂直</text></svg><p>实际是略微凸起的曲面。蓝色是常见辅助标识，具体以产品标注为准。</p></div><div><h3>APC · 常见绿色标识</h3><svg viewBox="0 0 330 125" role="img" aria-label="APC 端面带约 8 度斜角。"><rect x="22" y="32" width="96" height="63" rx="5" fill="#edf5f1" stroke="#89b4a2"/><path d="M118 43H215L221 84H118Z" fill="#f7fafb" stroke="#6f8799" stroke-width="2"/><path d="M36 63H218" fill="none" stroke="#33766c" stroke-width="3"/><path d="M244 16L219 46" stroke="#879aaa" fill="none"/><text x="225" y="15" class="svg-small">倾斜约 8°</text></svg><p>两端斜面需要匹配。UPC 与 APC 端面不要直接对接。</p></div></div><figcaption>同一种外形也可以有不同端面，例如 LC/UPC 和 LC/APC。外壳颜色不能代替规格核对。</figcaption></figure>
