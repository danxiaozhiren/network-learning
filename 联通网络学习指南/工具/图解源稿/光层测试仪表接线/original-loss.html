<div class="figure-head"><b>同一段线路，先留参考，再量损耗</b><span>1550 nm · A → B · 20 km</span></div>
<div class="overview"><div class="overview-label"><b>被测线路的位置始终保留</b><span>两端业务设备已脱开</span></div><div class="network"><div class="station" id="loss-a"><strong>A 配线架</strong><i class="port"></i><small>线路起点 · 0 km</small></div><div class="fiber">8 km<i></i><small>光纤</small></div><div class="station" id="loss-c"><strong>C 接续点</strong><i class="port"></i><small>两段光纤熔接</small></div><div class="fiber">12 km<i></i><small>光纤</small></div><div class="station" id="loss-b"><strong>B 配线架</strong><i class="port"></i><small id="loss-b-status">线路终点 · 20 km</small></div></div><p class="position" id="loss-position">当前：两台仪器放在一起，准备参考接线。</p></div>

<div class="stage" id="loss-change"><div class="measurement"><div class="meter"><i class="socket"></i><b>稳定光源</b><small id="source-place">参考端</small><div class="lcd">1550<span>nm · 测试波长</span></div><div class="meter-buttons"><i></i><i></i><i></i></div></div><div class="test-path"><span class="path-tag" id="loss-path-name">参考跳纤</span><div class="fiber-line off" id="loss-wire"></div><div class="path-points" id="loss-path-points"><span>光源输出口</span><span>功率计输入口</span></div><p id="loss-path-note" class="small">先不接入 A—B 线路</p></div><div class="meter"><i class="socket"></i><b>光功率计</b><small id="meter-place">与光源放在一起</small><div class="lcd" id="power-display">—<span>等待测量</span></div><div class="meter-buttons"><i></i><i></i><i></i></div></div></div>
