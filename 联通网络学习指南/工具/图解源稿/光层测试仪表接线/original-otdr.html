<figure class="panel player" id="otdr-demo" aria-label="从 OTDR 测试口发光、接收返回光并定位线路事件">
<div class="figure-head"><b>把返回时间，放到距离轴上</b><span>同一段 A—C—B 光纤</span></div>
<div class="focus-head"><div><small id="otdr-location">A 侧 · 测试接线</small><h3 id="otdr-title">前接引纤，后接尾纤</h3></div><span class="count" id="otdr-count">1 / 5</span></div>
<div class="overview"><div class="overview-label"><b>仪表与被测线路怎样接</b><span>仪表在 A 侧，接收仍在同一个测试口</span></div><div class="trace-equipment"><div class="mini-instrument"><strong>OTDR 测试口</strong><i class="port"></i><div class="mini-screen" id="otdr-screen">待测试</div></div><div class="spool-label launch-spool"><div class="spool"></div>引纤 · 0.5 km</div><div class="trace-route"><div class="trace-nodes"><span>A 端连接<small>0 km</small></span><span>C 熔接点<small>8 km</small></span><span>B 端连接<small>20 km</small></span></div><div class="trace-line"><i id="test-pulse" hidden></i></div><p class="pulse-label" id="pulse-caption">引纤 → A → C → B → 尾纤</p></div><div class="spool-label tail-spool"><div class="spool"></div>尾纤 · 0.5 km</div></div><p class="position" id="otdr-position">当前：把两端连接点都纳入测量。</p></div>
<div class="stage" id="otdr-change"><p class="chart-title">相对背向散射电平（dB） · 向右表示离 A 更远</p><div class="chart-wrap" tabindex="0" aria-label="OTDR 曲线，窄屏可横向滚动"><svg class="chart" viewBox="0 0 900 290" role="img" aria-labelledby="trace-title trace-desc"><title id="trace-title">A 到 B 的 OTDR 教学曲线</title><desc id="trace-desc">先接线，尚未测得曲线。横轴是距 A 的距离。</desc><g class="grid"><path d="M48 45H850M48 105H850M48 165H850M48 225H850"/><path d="M70 35V240M358 35V240M502 35V240M790 35V240"/></g><path class="axis" d="M48 30V240H855"/><g><text x="15" y="50">0</text><text x="8" y="110">−5</text><text x="0" y="170">−10</text><text x="0" y="230">−15</text><text x="70" y="266" text-anchor="middle">A · 0</text><text x="358" y="266" text-anchor="middle">C · 8</text><text x="502" y="266" text-anchor="middle">12</text><text x="790" y="266" text-anchor="middle">B · 20</text><text x="850" y="286" text-anchor="end">距 A 的距离 / km</text></g><path class="trace" id="otdr-curve" d=""/><path class="noise" id="otdr-noise" d=""/><path class="emphasis" id="event-marker" d=""/><text id="curve-state" x="440" y="145" text-anchor="middle">等待采集返回光</text></svg></div><div class="event-readout" id="otdr-result"><div><small>当前测量进展</small><b id="event-value">还没有曲线</b></div><p id="event-detail">引纤把 A 端连接点移到仪表能够分辨的位置；尾纤在 B 端之后提供一段可比较的返回光。</p></div></div>
<p class="explanation" id="otdr-explanation">尾纤是接在被测线路末端的已知光纤，用来测清 B 端连接损耗。引纤、尾纤的长度按仪表和脉冲设置选取，0.5 km 仅是本图示例。</p>
<div class="controls"><label class="step-select"><span class="sr-only">OTDR 测试步骤</span><select id="otdr-step" aria-label="OTDR 测试步骤"><option value="0">1 接好引纤与尾纤</option><option value="1">2 发出测试光脉冲</option><option value="2">3 接收返回光</option><option value="3">4 按距离形成曲线</option><option value="4">5 对应现场位置</option></select></label><div class="actions"><button class="button" id="otdr-prev" disabled>上一步</button><button class="button primary" id="otdr-next">下一步</button><button class="button reset" id="otdr-reset">重看</button></div><label class="experiment"><span class="control-label">线路条件</span><select id="otdr-condition" aria-label="改变 OTDR 线路条件"><option value="normal">正常连接与熔接点</option><option value="bend">距 A 12 km 处额外弯曲损耗</option><option value="break">距 A 12 km 处断纤</option></select></label></div><p class="sr-only" id="otdr-live" aria-live="polite"></p>
</figure>
