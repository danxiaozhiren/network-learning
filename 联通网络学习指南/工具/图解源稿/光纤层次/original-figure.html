<figure class="panel reading"><div class="figure-head"><b>从光缆里，找到一根光纤</b><span>剖面示意 · 不按比例</span></div><div class="fiber-layout"><svg viewBox="0 0 430 265" role="img" aria-label="光缆的外护套内有多根受保护的光纤；放大其中一根，可以看到纤芯、包层和涂覆层。"><circle cx="111" cy="112" r="88" fill="#334a5c"/><circle cx="111" cy="112" r="68" fill="#eef2f5" stroke="#a3b6c4" stroke-width="3"/><g fill="#e1c984" stroke="#ac9561" stroke-width="1.5"><circle cx="86" cy="87" r="14"/><circle cx="130" cy="77" r="14"/><circle cx="149" cy="121" r="14"/><circle cx="110" cy="148" r="14"/><circle cx="74" cy="127" r="14"/></g><g fill="#315e86"><circle cx="86" cy="87" r="3"/><circle cx="130" cy="77" r="3"/><circle cx="149" cy="121" r="3"/><circle cx="110" cy="148" r="3"/><circle cx="74" cy="127" r="3"/></g><path d="M145 72L279 48M161 131L282 175" fill="none" stroke="#a6b8c5" stroke-dasharray="5 5"/><circle cx="330" cy="111" r="70" fill="#e1c984" stroke="#b8a067" stroke-width="2"/><circle cx="330" cy="111" r="52" fill="#d6e5ef" stroke="#a6c5db" stroke-width="2"/><circle cx="330" cy="111" r="12" fill="#315e86"/><text x="111" y="230" text-anchor="middle" class="svg-label">光缆</text><text x="330" y="230" text-anchor="middle" class="svg-label">一根光纤</text><text x="111" y="253" text-anchor="middle" class="svg-small">外护套与内部保护结构</text><text x="330" y="253" text-anchor="middle" class="svg-small">局部放大</text></svg><ul class="fiber-key"><li><b>纤芯</b><p>位于光纤中心，是导光结构的核心。</p></li><li><b>包层</b><p>围住纤芯，帮助把光限制在导光结构中。</p></li><li><b>涂覆层</b><p>包在玻璃外面，保护光纤。</p></li></ul></div><figcaption>实际光缆可能有套管、加强件等不同结构；图中只展开“保护结构 → 光纤”的关系。</figcaption></figure>
